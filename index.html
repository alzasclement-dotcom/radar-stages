<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar Stages</title>
<meta name="description" content="Stages en gestion de patrimoine, investissement et distribution de fonds, mis à jour chaque matin.">
<style>
:root{--bg:#f7f7f5;--surface:#fff;--text:#1c1f24;--muted:#5d6570;--line:#dcdfe3;--accent:#1f4e8c;--accent-ink:#fff;--warn:#8a4b00;--warn-bg:#fdf1e0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--surface:#1c2025;--text:#e8eaed;--muted:#9aa3ad;--line:#2d333a;--accent:#7fb0ee;--accent-ink:#0d1621;--warn:#f0b66b;--warn-bg:#2b2113}}
:root[data-theme="dark"]{--bg:#14171b;--surface:#1c2025;--text:#e8eaed;--muted:#9aa3ad;--line:#2d333a;--accent:#7fb0ee;--accent-ink:#0d1621;--warn:#f0b66b;--warn-bg:#2b2113}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:60rem;margin:0 auto;padding:0 16px 48px}
header{padding:24px 0 8px;display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
h1{font-size:1.5rem;margin:0}
h2{font-size:1.05rem;margin:0 0 8px}
.meta{color:var(--muted);margin:4px 0 0;font-size:.9rem}
a{color:var(--accent)}
button,select,input{font:inherit;color:inherit}
button,.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;text-decoration:none;display:inline-block}
button:hover,.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin:16px 0}
.news ul{margin:0;padding-left:20px}
.filters{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:end}
.filters label{display:flex;flex-direction:column;font-size:.85rem;color:var(--muted);gap:2px}
.filters label.check{flex-direction:row;align-items:center;gap:6px;padding-bottom:6px}
.filters select,.filters input[type=number]{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:8rem}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0 8px}
.section-h{margin:24px 0 8px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:16px 0 0;padding-bottom:0}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:6px 6px 0 0;background:none;padding:8px 12px;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected="true"]{border-bottom-color:var(--accent);color:var(--text);font-weight:600}
.tabs .n{display:inline-block;min-width:1.5em;margin-left:6px;padding:0 6px;border-radius:999px;background:var(--line);font-size:.8rem;font-weight:600;color:var(--text)}
.note{color:var(--muted);font-size:.88rem;margin:0 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;margin:0 0 12px}
.card.mini{padding:10px 16px}
.top{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.card h3{margin:0;font-size:1.05rem;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
.pill{flex:none;min-width:3rem;text-align:center;font-weight:700;border-radius:999px;padding:2px 10px;border:2px solid var(--accent);color:var(--accent)}
.pill.hi{background:var(--accent);color:var(--accent-ink)}
.pill.lo{border-color:var(--line);color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;padding:0;list-style:none}
.tags li{font-size:.8rem;border:1px solid var(--line);border-radius:4px;padding:1px 8px;color:var(--muted)}
.tags li.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.tags li.fresh{border-color:var(--accent);color:var(--accent)}
.card dl{margin:8px 0;display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;font-size:.92rem}
.card dt{color:var(--muted)}
.card dd{margin:0;overflow-wrap:anywhere}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.actions select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
details.arch>summary{cursor:pointer;font-weight:600;padding:8px 0}
.empty,.err{color:var(--muted);padding:16px 0}
.err{color:var(--warn)}
@media (max-width:480px){.card dl{grid-template-columns:1fr}.card dt{margin-top:4px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>Radar Stages</h1>
    <p class="meta" id="meta">Chargement…</p>
  </div>
  <button type="button" id="theme" aria-label="Changer de thème">Thème</button>
</header>
<main>
  <section class="panel news" id="news" hidden aria-labelledby="news-h"><h2 id="news-h">Nouveautés du jour</h2><ul id="news-list"></ul></section>
  <section class="panel" aria-label="Filtres">
    <div class="filters">
      <label>Métier<select id="f-metier"><option value="">Tous</option><option value="sales_ir">Sales / investor relations / distribution</option><option value="allocation">Allocation / conseil en investissement</option><option value="patrimoine">Gestion de patrimoine / banque privée</option><option value="asset_management">Asset management</option><option value="epargne_assurance">Épargne / assurance</option><option value="banque_finance">Banque / finance (entreprise, crédit, conseil)</option></select></label>
      <label>Zone<select id="f-zone"><option value="">Toutes</option><option value="paris">Paris / Île-de-France</option><option value="montpellier">Montpellier / Occitanie</option><option value="autre">Reste de la France</option></select></label>
      <label>Score minimum<input type="number" id="f-score" min="0" max="100" step="5" value="0"></label>
      <label>Tri<select id="f-tri"><option value="score">Meilleur score</option><option value="recent">Plus récentes</option></select></label>
      <label class="check"><input type="checkbox" id="f-30"> Publiées il y a moins de 30 jours</label>
    </div>
  </section>
  <div class="tabs" role="tablist" aria-label="Mes offres" id="tabs"></div>
  <div class="bar"><h2 id="count" aria-live="polite" style="margin:0"></h2><button type="button" id="csv">Exporter en CSV</button></div>
  <p class="note" id="tab-note"></p>
  <div id="list" role="tabpanel"></div>
</main>
</div>
<script>
(function(){
"use strict";
var METIERS={sales_ir:"Sales / investor relations",allocation:"Allocation / conseil en investissement",patrimoine:"Gestion de patrimoine / banque privée",asset_management:"Asset management",epargne_assurance:"Épargne / assurance",banque_finance:"Banque / finance (entreprise, crédit, conseil)"};
var NIVEAUX={bac3_4:"Bac+3 / Bac+4 accepté",bac4_5:"Bac+4/5",non_precise:"Niveau à vérifier"};
var SUIVI={"":"Aucun suivi",a_postuler:"À postuler",postule:"Postulé",entretien:"Entretien",refuse:"Refusé",pas_interesse:"Pas intéressé"};
var CANDIDAT={postule:1,entretien:1,refuse:1};
var MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
var MAX_PAR_EMPLOYEUR=5, PART_AMBITIEUSES=0.10;
var data=null, shown=[], suivi={}, newsCount=0;

function $(id){return document.getElementById(id)}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function norm(s){return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase()}
function zone(o){var r=norm(o.region);return r==="ile-de-france"?"paris":r==="occitanie"?"montpellier":"autre"}
function fmtMois(d){if(!d)return null;var m=/^(\d{4})-(\d{2})/.exec(d);return m?MOIS[+m[2]-1]+" "+m[1]:d}
function fmtDate(d){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d||"");return m?(+m[3])+" "+MOIS[+m[2]-1]+" "+m[1]:"—"}
function age(o){
  var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(o.date_publication||"");if(!m)return null;
  var d=Date.UTC(+m[1],+m[2]-1,+m[3]),n=new Date(),t=Date.UTC(n.getFullYear(),n.getMonth(),n.getDate());
  return Math.max(0,Math.round((t-d)/864e5));
}
function fmtAge(a){return a===0?"aujourd'hui":a===1?"hier":"il y a "+a+" jours"}
function statut(o){return suivi[o.id]||(o.deja_postule?"postule":"")}

function load(){try{suivi=JSON.parse(localStorage.getItem("radar-suivi")||"{}")||{}}catch(e){suivi={}}}
function save(){try{localStorage.setItem("radar-suivi",JSON.stringify(suivi))}catch(e){}}

function setTheme(t){
  if(t)document.documentElement.setAttribute("data-theme",t);else document.documentElement.removeAttribute("data-theme");
}
function initTheme(){
  try{var t=localStorage.getItem("radar-theme");if(t)setTheme(t)}catch(e){}
  $("theme").addEventListener("click",function(){
    var cur=document.documentElement.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
    var next=cur==="dark"?"light":"dark";setTheme(next);
    try{localStorage.setItem("radar-theme",next)}catch(e){}
  });
}

function pill(o){var p=el("span","pill"+(o.score>=80?" hi":o.score<60?" lo":""),String(o.score));p.title="Score d'adéquation sur 100";p.setAttribute("aria-label","Score "+o.score+" sur 100");return p}

function card(o,expired){
  var s=statut(o);
  var c=el("article","card"+(s==="pas_interesse"?" mini":""));c.id="o-"+o.id;
  var top=el("div","top"),l=el("div");
  l.appendChild(el("h3",null,o.titre));
  l.appendChild(el("p","sub",o.entreprise+" · "+o.ville));
  top.appendChild(l);top.appendChild(pill(o));c.appendChild(top);
  if(s==="pas_interesse"&&!expired){
    var b=el("button",null,"Remettre dans la liste");b.type="button";
    b.addEventListener("click",function(){delete suivi[o.id];save();render()});
    c.appendChild(b);return c;
  }
  var tags=el("ul","tags"),a=age(o);
  if(a!==null)tags.appendChild(el("li","fresh","Publiée "+fmtAge(a)+(o.date_estimee?" (estimé)":"")));
  else tags.appendChild(el("li","warn","Date de publication inconnue"));
  tags.appendChild(el("li",null,METIERS[o.metier]||o.metier));
  tags.appendChild(el("li",o.niveau==="non_precise"?"warn":null,NIVEAUX[o.niveau]||o.niveau));
  if(o.type_source==="agregateur")tags.appendChild(el("li","warn","Source : agrégateur"));
  if(!o.date_debut)tags.appendChild(el("li","warn","Date de début à vérifier"));
  c.appendChild(tags);
  var dl=el("dl");
  function row(k,v){dl.appendChild(el("dt",null,k));dl.appendChild(el("dd",null,v))}
  row("Début",(fmtMois(o.date_debut)||"à vérifier")+(o.duree?" · "+o.duree+" mois":""));
  row("Pourquoi",o.pourquoi);row("Vigilance",o.vigilance);row("Angle",o.angle);
  c.appendChild(dl);
  var act=el("div","actions");
  var link=el("a","btn primary","Voir l'offre");link.href=o.url;link.target="_blank";link.rel="noopener noreferrer";
  link.setAttribute("aria-label","Voir l'offre : "+o.titre+" (nouvel onglet)");act.appendChild(link);
  if(!expired){
    var lab=el("label",null,"Suivi : ");lab.className="sub";
    var sel=el("select");
    Object.keys(SUIVI).forEach(function(k){var op=el("option",null,SUIVI[k]);op.value=k;if(k===s)op.selected=true;sel.appendChild(op)});
    sel.addEventListener("change",function(){if(sel.value)suivi[o.id]=sel.value;else suivi[o.id]="";save();render()});
    lab.appendChild(sel);act.appendChild(lab);
  }
  c.appendChild(act);return c;
}

function sorter(){
  var t=$("f-tri").value;
  return function(a,b){
    if(t==="recent"){
      var x=age(a),y=age(b);x=x===null?1e9:x;y=y===null?1e9:y;
      if(x!==y)return x-y;
    }
    return b.score-a.score;
  };
}

function matches(o){
  var m=$("f-metier").value,z=$("f-zone").value,min=+$("f-score").value||0,r=$("f-30").checked,a=age(o);
  return (!m||o.metier===m)&&(!z||zone(o)===z)&&o.score>=min&&(!r||(a!==null&&a<30));
}

var TABS=[
  {id:"todo",label:"À traiter",note:""},
  {id:"li",label:"Recherche LinkedIn",note:"Offres trouvées sur LinkedIn, les plus récentes d'abord puis les plus compatibles avec votre profil. Cette vue reprend aussi des offres de l'onglet À traiter."},
  {id:"cand",label:"Candidatures",note:"Offres où vous avez postulé, avez un entretien ou avez reçu un refus."},
  {id:"no",label:"Pas intéressé",note:"Offres écartées. Vous pouvez les remettre dans la liste."},
  {id:"amb",label:"Ambitieuses",note:"Maisons très sélectives, qui recrutent surtout en grandes écoles. Limitées à 10 % des offres à traiter."},
  {id:"arch",label:"Archive",note:"Offres qui ne sont plus en ligne."}
];
var tab="todo";
function loadTab(){try{var t=localStorage.getItem("radar-onglet");if(TABS.some(function(x){return x.id===t}))tab=t}catch(e){}}
function setTab(id,focus){
  tab=id;try{localStorage.setItem("radar-onglet",id)}catch(e){}
  render();
  if(focus){var b=document.querySelector('#tabs [aria-selected="true"]');if(b)b.focus()}
}

function buckets(){
  var active=data.offres.filter(function(o){return o.statut==="active"&&matches(o)}).sort(sorter());
  var B={todo:[],li:[],cand:[],no:[],amb:[],arch:[],ambHidden:0};
  active.forEach(function(o){
    var s=statut(o);
    if(s==="pas_interesse")B.no.push(o);
    else if(CANDIDAT[s])B.cand.push(o);
    else if(o.ambitieuse)B.amb.push(o);
    else B.todo.push(o);
    if(!CANDIDAT[s]&&s!=="pas_interesse"&&!o.ambitieuse&&/linkedin\.com/.test(o.url))B.li.push(o);
  });
  B.li.sort(function(a,b){
    var x=age(a),y=age(b);x=x===null?99:Math.floor(x/7);y=y===null?99:Math.floor(y/7);
    return x-y||b.score-a.score;
  });
  var count={};
  B.todo=B.todo.filter(function(o){var k=norm(o.entreprise);count[k]=(count[k]||0)+1;return count[k]<=MAX_PAR_EMPLOYEUR});
  B.todo.sort(function(a,b){return (statut(b)==="a_postuler")-(statut(a)==="a_postuler")});
  var cap=Math.max(1,Math.floor(PART_AMBITIEUSES*B.todo.length/(1-PART_AMBITIEUSES)));
  B.ambHidden=Math.max(0,B.amb.length-cap);B.amb=B.amb.slice(0,cap);
  B.arch=data.offres.filter(function(o){return o.statut==="expiree"});
  return B;
}

var LI_SEARCHES=[
  ["Gestion de patrimoine, CGP, conseiller patrimonial","stage \"gestion de patrimoine\" OR CGP OR \"conseiller patrimonial\"","France"],
  ["Investor relations, distribution, partenariats CGP","stage \"investor relations\" OR \"relations investisseurs\" OR \"partenariats CGP\" OR \"distribution fonds\"","France"],
  ["Banque privée, family office, gestion pilotée","stage \"banque privée\" OR \"gestion privée\" OR \"family office\" OR \"gestion pilotée\"","France"],
  ["Épargne, SCPI, assurance vie, plateformes d'investissement","stage épargne OR SCPI OR \"assurance vie\" OR \"plateforme d'investissement\"","France"],
  ["Montpellier et alentours : finance, patrimoine","stage finance OR patrimoine OR investissement OR banque","Montpellier"],
  ["AXA : investissement, épargne, patrimoine","AXA stage investissement OR épargne OR patrimoine OR \"gestion d'actifs\"","France"],
  ["Crédit Agricole et caisses régionales, Indosuez, Amundi","stage \"Crédit Agricole\" OR Indosuez OR Amundi OR LCL patrimoine OR \"banque privée\" OR épargne OR investissement","France"],
  ["BNP Paribas : gestion de patrimoine, banque privée, asset management","\"BNP Paribas\" stage \"gestion de patrimoine\" OR \"banque privée\" OR \"asset management\" OR \"wealth management\"","France"]
];
function linkedinSearches(){
  var box=el("section","panel");box.appendChild(el("h2",null,"Lancer une recherche LinkedIn (7 derniers jours)"));
  box.appendChild(el("p","note","Stages, publiés cette semaine, plus récents d'abord. Les résultats s'ouvrent sur LinkedIn dans un nouvel onglet."));
  var ul=el("ul");ul.style.margin="0";ul.style.paddingLeft="20px";
  LI_SEARCHES.forEach(function(q){
    var li=el("li"),a=el("a",null,q[0]);
    a.href="https://www.linkedin.com/jobs/search/?keywords="+encodeURIComponent(q[1])+"&location="+encodeURIComponent(q[2])+"&f_JT=I&f_TPR=r604800&sortBy=DD"+(q[2]==="Montpellier"?"&distance=50":"");
    a.target="_blank";a.rel="noopener noreferrer";li.appendChild(a);ul.appendChild(li);
  });
  box.appendChild(ul);return box;
}

function renderTabs(B){
  var box=$("tabs");box.textContent="";
  TABS.forEach(function(t,i){
    var b=el("button",null,t.label);b.type="button";b.id="tab-"+t.id;b.setAttribute("role","tab");
    b.setAttribute("aria-selected",t.id===tab?"true":"false");b.setAttribute("aria-controls","list");b.tabIndex=t.id===tab?0:-1;
    b.appendChild(el("span","n",String(B[t.id].length)));
    b.addEventListener("click",function(){setTab(t.id,false)});
    b.addEventListener("keydown",function(e){
      var d=e.key==="ArrowRight"?1:e.key==="ArrowLeft"?-1:0;if(!d)return;
      e.preventDefault();setTab(TABS[(i+d+TABS.length)%TABS.length].id,true);
    });
    box.appendChild(b);
  });
  $("list").setAttribute("aria-labelledby","tab-"+tab);
}

function render(){
  var B=buckets(),list=$("list");list.textContent="";
  renderTabs(B);
  var t=TABS.filter(function(x){return x.id===tab})[0],items=B[tab];
  shown=items;
  var total=data.offres.filter(function(o){return o.statut==="active"}).length;
  $("count").textContent=items.length+" offre"+(items.length>1?"s":"")+(tab==="todo"?" à traiter sur "+total+" actives":"");
  var note=t.note;
  if(tab==="amb"&&B.ambHidden)note+=" "+B.ambHidden+" autre"+(B.ambHidden>1?"s":"")+" masquée"+(B.ambHidden>1?"s":"")+".";
  $("tab-note").textContent=note;$("tab-note").hidden=!note;
  $("news").hidden=tab!=="todo"||!newsCount;
  if(tab==="li")list.appendChild(linkedinSearches());
  if(!items.length){
    var msg={li:"Aucune offre LinkedIn avec ces filtres.",todo:"Aucune offre à traiter avec ces filtres.",cand:"Aucune candidature pour l'instant. Passez une offre en « Postulé » depuis l'onglet À traiter.",no:"Aucune offre écartée.",amb:"Aucune offre ambitieuse avec ces filtres.",arch:"Aucune offre expirée pour l'instant."}[tab];
    list.appendChild(el("p","empty",msg));return;
  }
  if(tab==="cand"){
    [["entretien","Entretien"],["postule","Postulé"],["refuse","Refusé"]].forEach(function(g){
      var sub=items.filter(function(o){return statut(o)===g[0]});if(!sub.length)return;
      list.appendChild(el("h3","section-h",g[1]+" ("+sub.length+")"));
      sub.forEach(function(o){list.appendChild(card(o,false))});
    });
    return;
  }
  items.forEach(function(o){list.appendChild(card(o,tab==="arch"))});
}

function news(){
  var maj=data.derniere_mise_a_jour;
  var n=data.offres.filter(function(o){return o.statut==="active"&&!o.deja_postule&&!suivi[o.id]&&maj&&o.premiere_detection===maj});
  newsCount=n.length||1;$("news").hidden=false;var ul=$("news-list");ul.textContent="";
  if(!n.length){ul.appendChild(el("li",null,"Aucune nouvelle offre depuis le dernier passage."));return}
  n.sort(function(a,b){
    var x=age(a),y=age(b);x=x===null?1e9:x;y=y===null?1e9:y;
    return x-y||b.score-a.score;
  });
  var vues=0;
  n.forEach(function(o){
    if(vues>=12)return;vues++;
    var li=el("li"),a=el("a",null,o.titre);a.href="#o-"+o.id;
    li.appendChild(a);li.appendChild(document.createTextNode(" — "+o.entreprise+", "+o.ville+" ("+o.score+")"));ul.appendChild(li);
  });
  if(n.length>vues)ul.appendChild(el("li",null,"… et "+(n.length-vues)+" autre"+(n.length-vues>1?"s":"")+" ci-dessous."));
}

function csvCell(v){return '"'+String(v==null?"":v).replace(/"/g,'""')+'"'}
function exportCsv(){
  var cols=["titre","entreprise","ville","region","metier","date_debut","duree","niveau","score","date_publication","pourquoi","vigilance","angle","url","type_source","statut"];
  var lines=[cols.concat(["suivi"]).map(csvCell).join(";")];
  shown.forEach(function(o){lines.push(cols.map(function(k){return csvCell(o[k])}).concat([csvCell(SUIVI[statut(o)]||"")]).join(";"))});
  var blob=new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="radar-stages.csv";
  document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},1000);
}

function start(d){
  data=d;
  var actifs=d.offres.filter(function(o){return o.statut==="active"}).length;
  $("meta").textContent="Mise à jour : "+fmtDate(d.derniere_mise_a_jour)+" · "+actifs+" offre"+(actifs>1?"s":"")+" active"+(actifs>1?"s":"");
  news();render();
}

initTheme();load();loadTab();
["f-metier","f-zone","f-score","f-tri","f-30"].forEach(function(id){$(id).addEventListener("input",render)});
$("csv").addEventListener("click",exportCsv);
